<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="site-header">
    <h1>My Library</h1>
    <p class="tagline">A personal reading tracker.</p>

    <nav class="jump-nav">
      <a href="#want-to-read">Want to Read</a>
      <a href="#reading">Reading</a>
      <a href="#finished">Finished</a>
    </nav>
  </header>

  <main>

    <!-- ============ ADD A BOOK ============
         A real <form> element, so pressing Enter in a text box submits it
         and the browser enforces the required fields for us. -->
    <section class="add-book">
      <h2 class="add-book__heading">Add a book</h2>

      <form id="add-book-form">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required autocomplete="off">
        </div>

        <div class="field">
          <label for="author">Author</label>
          <input type="text" id="author" name="author" required autocomplete="off">
        </div>

        <div class="field">
          <label for="status">Status</label>
          <!-- These value="" strings must match the status keys used in app.js. -->
          <select id="status" name="status">
            <option value="want">Want to Read</option>
            <option value="reading" selected>Reading</option>
            <option value="finished">Finished</option>
          </select>
        </div>

        <button type="submit" class="btn">Add book</button>
      </form>
    </section>

    <!-- ============ THE THREE SHELVES ============
         These lists are deliberately EMPTY. app.js fills them in.
         data-status is how the JavaScript knows which list is which. -->

    <section class="shelf" id="want-to-read">
      <h2 class="shelf__heading">Want to Read <span class="count">0</span></h2>
      <ul class="book-list" data-status="want"></ul>
    </section>

    <section class="shelf" id="reading">
      <h2 class="shelf__heading">Reading <span class="count">0</span></h2>
      <ul class="book-list" data-status="reading"></ul>
    </section>

    <section class="shelf" id="finished">
      <h2 class="shelf__heading">Finished <span class="count">0</span></h2>
      <ul class="book-list" data-status="finished"></ul>
    </section>

  </main>

  <footer class="site-footer">
    <p>Stage 2 of 5 &mdash; the page is now drawn by JavaScript. Refreshing resets it.</p>
  </footer>

  <!-- Loaded last, so every element above already exists when the script runs. -->
  <script src="app.js"></script>

</body>
</html>
